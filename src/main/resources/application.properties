spring.application.name=ms-producto-facturador-electronico
server.port=8098

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# El nombre del servicio coincide con ms-producto-facturador-electronico.properties en Git.
# Sin optional: el servicio necesita la configuracion remota para arrancar.
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.label=${CONFIG_GIT_LABEL:main}
